# Metadata for a third-party library vendored into RT.
#
# This file is the single source of truth for the library's metadata. The
# top-level devel/third-party/README is generated from these files. Narrative
# upgrade/build instructions live in the per-directory file pointed at by
# upgrade-instructions: below. See devel/third-party/SCHEMA.md for the full
# field reference.

name: chosen
version: "1.4.2"

upstream:
  homepage: https://harvesthq.github.io/chosen/
  repository: https://github.com/harvesthq/chosen

license:
  spdx: MIT
  file: LICENSE.md

purl: pkg:npm/chosen-js@1.4.2
cpe: ~

description: >
  Replaces native <select> elements with a more user-friendly autocomplete
  dropdown.

shipped: true
security-critical: true

upgrade-instructions: ~

artifacts: []

patches: []

notes: |
  The npm package name is `chosen-js`; the bare `chosen` name on npm
  belongs to an unrelated package.

# Metadata for a third-party library vendored into RT.
#
# This file is the single source of truth for the library's metadata. The
# top-level devel/third-party/README is generated from these files. Narrative
# upgrade/build instructions live in the per-directory file pointed at by
# upgrade-instructions: below. See devel/third-party/SCHEMA.md for the full
# field reference.

name: ckeditor4
version: "4.20.1"

upstream:
  homepage: https://ckeditor.com/ckeditor-4/
  repository: https://github.com/ckeditor/ckeditor4

license:
  spdx: GPL-2.0-or-later
  # CKEditor 4 is offered under a choice of GPL, LGPL, or MPL (or a
  # commercial license from CKSource). RT uses the GPL option.
  # COPYING.GPL is the operative GPL v2 license text; LICENSE.md is the
  # upstream-shipped summary describing the multi-license arrangement.
  file: COPYING.GPL

purl: pkg:npm/ckeditor4@4.20.1
cpe: ~

description: >
  WYSIWYG rich-text editor (version 4 series). Parses and renders
  user-supplied HTML, so any vulnerability here is a direct XSS exposure
  in RT's ticket UI.

shipped: true
security-critical: true

upgrade-instructions: ~

artifacts: []

patches: []

notes: |
  CKEditor 4 is in extended-support mode upstream; CKEditor 5 ships in
  RT 6.0 and onward, while RT 5 stays on the 4.x line. The directory
  holds both COPYING.GPL (the operative GPL v2 license text RT uses) and
  LICENSE.md (the upstream summary describing the GPL/LGPL/MPL choice
  alongside the commercial alternative).

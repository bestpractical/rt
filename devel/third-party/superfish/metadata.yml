# Metadata for a third-party library vendored into RT.
#
# This file is the single source of truth for the library's metadata. The
# top-level devel/third-party/README is generated from these files. Narrative
# upgrade/build instructions live in the per-directory file pointed at by
# upgrade-instructions: below. See devel/third-party/SCHEMA.md for the full
# field reference.

name: superfish
version: "1.7.10"

upstream:
  homepage: https://superfish.joelbirch.design/
  repository: https://github.com/joeldbirch/superfish

license:
  spdx: MIT
  file: MIT-LICENSE.txt

purl: pkg:github/joeldbirch/superfish@1.7.10
cpe: ~

description: >
  Enhanced Suckerfish-style menu plugin for jQuery.

shipped: true
security-critical: false

upgrade-instructions: ~

artifacts: []

patches: []

notes: |
  The vendored superfish.js source-file header declares dual MIT/GPL
  licensing; upstream's repo currently ships only MIT-LICENSE.txt. SPDX
  is set to MIT because we use the MIT half of the dual offer.

  The purl uses the github form because superfish has had inconsistent
  npm publishing history; the github purl resolves against the actual
  shipped artifact more reliably than guessing at an npm package name.
